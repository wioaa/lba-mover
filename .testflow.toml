# testflow 配置 —— 见 tools/TESTFLOW.md
#
# 换了新项目只要改这个文件：命令、监视范围、产物清理全是声明式的，
# tools/testflow.py 本身不含任何本项目专属逻辑。

[project]
name = "lbamover"
report = ".testflow/last-run.json"

[profiles.default]
# 参与"运行期间源码是否被改动"快照的 glob。跑测试时改这里列的文件，
# 结论会直接判 INVALID。
watch = [
  "src/**/*.py",
  "tests/**/*.py",
  "scripts/*.py",
]

# 测试会写出来的运行时文件，跑完自动清掉
artifacts = [
  ".tmp/",
]

timeout = 900

# 环境自检：src 布局靠 PYTHONPATH 注入，缺了就是一屏 ModuleNotFoundError
preflight = [
  { type = "python", min = "3.11", name = "Python 3.11+" },
  { type = "module", value = "pytest", name = "pytest" },
  { type = "module", value = "PySide6", name = "PySide6", required = false },
]

# 磁盘上有 test_*.py 但一个用例都没被收集 = 静默漏测
inventory = { timeout = 120 }

steps = [
  { name = "pytest", command = ["{python}", "-m", "pytest", "-q", "--durations=5"], parser = "pytest", env = { PYTHONPATH = "src", PYTHONDONTWRITEBYTECODE = "1" } },
  { name = "smoke", command = ["{python}", "scripts/smoke.py"], parser = "generic", required = false, env = { PYTHONPATH = "src", PYTHONDONTWRITEBYTECODE = "1", QT_QPA_PLATFORM = "offscreen" } },
]

# 只看失败重跑，排查时用：python tools/testflow.py --profile lastfailed
[profiles.lastfailed]
watch = ["src/**/*.py", "tests/**/*.py"]
artifacts = [".tmp/"]
timeout = 900
steps = [
  { name = "pytest-lf", command = ["{python}", "-m", "pytest", "-q", "--lf"], parser = "pytest", env = { PYTHONPATH = "src", PYTHONDONTWRITEBYTECODE = "1" } },
]
